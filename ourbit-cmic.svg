<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="215" viewBox="30 80 1340 215" role="img" aria-labelledby="title desc">
  <title id="title">OURBIT × CMIC</title>
  <desc id="desc">OURBIT and CMIC partnership lockup with a blue X separator on a transparent background.</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#28e6a0"/><stop offset="1" stop-color="#159a67"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13f5ff"/><stop offset=".45" stop-color="#087cff"/><stop offset="1" stop-color="#1839dc"/></linearGradient>
    <linearGradient id="white" gradientUnits="userSpaceOnUse" x1="0" y1="145" x2="0" y2="269"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dce7f5"/></linearGradient>
    <linearGradient id="whiteC" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="415"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dce7f5"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- OURBIT emblem -->
  <g transform="translate(40.3 145) scale(1.138)">
    <path d="M58 0 104 26 104 82 58 109 12 82 12 26 31 15 45 23 29 32 29 72 58 89 87 72 87 32 72 23Z" fill="url(#green)"/>
    <path d="M58 28 81 41 81 67 58 80 35 67 35 41Z" fill="#fff"/>
    <path d="M58 39 71 46.5 71 61.5 58 69 45 61.5 45 46.5Z" fill="#20c889"/>
  </g>

  <!-- OURBIT wordmark -->
  <g fill="url(#white)">
    <path fill-rule="evenodd" d="M214 145H222A36 36 0 0 1 258 181V233A36 36 0 0 1 222 269H214A36 36 0 0 1 178 233V181A36 36 0 0 1 214 145Z M218 169A16 16 0 0 1 234 185V229A16 16 0 0 1 218 245A16 16 0 0 1 202 229V185A16 16 0 0 1 218 169Z"/>
    <path d="M266 145H290V233A12 12 0 0 0 314 233V145H338V233A36 36 0 0 1 266 233Z"/>
    <path fill-rule="evenodd" d="M346 145H382A36 36 0 0 1 382 217H346Z M370 169H382A12 12 0 0 1 382 193H370Z"/>
    <rect x="346" y="145" width="24" height="124"/>
    <polygon points="372,205 398,205 420,269 394,269"/>
    <rect x="426" y="145" width="24" height="124"/>
    <path fill-rule="evenodd" d="M426 145H463A35 35 0 0 1 463 215H426Z M450 169H463A11 11 0 0 1 463 191H450Z"/>
    <path fill-rule="evenodd" d="M426 191H459A39 39 0 0 1 459 269H426Z M450 215H459A15 15 0 0 1 459 245H450Z"/>
    <rect x="538" y="145" width="72" height="24"/>
    <rect x="562" y="145" width="24" height="124"/>
  </g>
  <rect x="506" y="145" width="24" height="124" fill="url(#green)"/>

  <!-- Central X -->
  <path d="M642 131 696 131 755 186 814 131 868 131 789 207 868 283 814 283 755 228 696 283 642 283 721 207Z" fill="url(#blue)" stroke="#14eaff" stroke-width="4" stroke-linejoin="miter" filter="url(#glow)"/>
  <path d="M654 138 700 138 755 190 810 138 855 138 780 207 855 276 810 276 755 224 700 276 654 276 730 207Z" fill="none" stroke="#6cfaff" stroke-opacity=".7" stroke-width="2"/>

  <!-- CMIC: digambar ulang mengikuti logo asli -->
  <g transform="translate(866.9 -74.1) scale(0.827)" fill="url(#whiteC)">
    <!-- C pertama -->
    <polygon points="78,266 192,266 164,300 100,300 77,323 77,343 100,366 170,366 200,400 78,400 40,362 40,304"/>
    <!-- M -->
    <polygon points="214,414 214,284 248,284 277,336 306,284 340,284 340,414 308,414 308,340 277,392 246,340 246,414"/>
    <!-- 4 batang naik di dalam M -->
    <rect x="252" y="270" width="13" height="66"/>
    <rect x="274" y="248" width="13" height="88"/>
    <rect x="296" y="226" width="13" height="110"/>
    <rect x="318" y="204" width="13" height="132"/>
    <!-- I miring -->
    <polygon points="372,258 408,258 388,414 352,414"/>
    <!-- C kedua -->
    <g transform="translate(390 0)">
      <polygon points="78,266 192,266 164,300 100,300 77,323 77,343 100,366 170,366 200,400 78,400 40,362 40,304"/>
    </g>
    <!-- Panah tren -->
    <path d="M262 332 L302 318 L342 290 L394 250" fill="none" stroke="#1686ff" stroke-width="7" stroke-linejoin="miter"/>
    <polygon points="414,236 401,259 388,241" fill="#1686ff"/>
  </g>
</svg>
