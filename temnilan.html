<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TEMNILAN // DEGEN TERMINAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#050607; --panel:#0c0e10; --panel2:#111417; --line:#1e242a;
    --text:#e8eaec; --mut:#7d8790; --up:#22c55e; --down:#ef4444; --acc:#3b82f6;
    --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:12px/1.4 var(--mono);display:flex;flex-direction:column;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:2px;cursor:pointer;padding:4px 10px}
  button:hover:not(:disabled){border-color:var(--mut)}
  button:disabled{opacity:.35;cursor:not-allowed}
  button:focus-visible,input:focus-visible{outline:1px solid var(--acc);outline-offset:1px}
  .up{color:var(--up)} .down{color:var(--down)} .mut{color:var(--mut)}
  .na{color:var(--mut);font-size:10px}

  /* header */
  .top{display:flex;align-items:center;gap:24px;padding:0 16px;height:44px;border-bottom:1px solid var(--line);background:#000;flex-shrink:0}
  .brand{font:700 14px var(--sans);letter-spacing:.06em;white-space:nowrap}
  .brand span{color:var(--mut);font-weight:500}
  .tabs{display:flex;gap:2px;flex:1}
  .tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:12px 12px;color:var(--mut);letter-spacing:.06em}
  .tabs button.on{color:var(--text);border-bottom-color:var(--acc)}
  .status{display:flex;gap:16px;align-items:center;color:var(--mut);font-size:11px;white-space:nowrap}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mut);margin-right:6px}
  .dot.ok{background:var(--up);animation:pulse 2s ease-in-out infinite}
  .dot.bad{background:var(--down)}
  @keyframes pulse{50%{opacity:.35}}

  /* global stats */
  .stats{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;overflow-x:auto}
  .stat{flex:1 0 150px;padding:10px 16px;border-right:1px solid var(--line)}
  .stat:last-child{border-right:0}
  .stat .l{color:var(--mut);font-size:10px;letter-spacing:.08em;margin-bottom:2px}
  .stat .v{font-size:18px;font-weight:700}

  /* layout */
  .layout{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr}
  .side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .side h2,.panel h3{font:500 10px var(--mono);letter-spacing:.1em;color:var(--mut)}
  .side-head{padding:12px 12px 8px}
  .side input{width:100%;margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:2px;color:var(--text);font:inherit;padding:6px 8px}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .chips button{font-size:10px;padding:2px 7px;color:var(--mut)}
  .chips button.on{color:var(--text);border-color:var(--acc)}
  .list{flex:1;overflow-y:auto;border-top:1px solid var(--line)}
  .w{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-left:2px solid transparent;border-radius:0;padding:9px 12px}
  .w.on{background:var(--panel2);border-left-color:var(--acc)}
  .w .n{font-weight:700}
  .w .r{text-align:right}
  .w .sub{color:var(--mut);font-size:10px}

  /* main */
  main{overflow-y:auto;padding:16px;min-width:0}
  .empty{color:var(--mut);padding:40px 0;text-align:center}
  .wh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .wh h1{font:700 20px var(--sans);letter-spacing:.04em}
  .range{display:flex;gap:4px}
  .range button{font-size:10px;padding:3px 9px;color:var(--mut)}
  .range button.on{color:var(--text);border-color:var(--acc)}
  .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:14px}
  .grid5 .stat{background:var(--panel);border:0}
  .panel{border:1px solid var(--line);background:var(--panel);margin-bottom:14px}
  .panel>h3{padding:8px 12px;border-bottom:1px solid var(--line)}
  .ph{padding:28px 12px;color:var(--mut);text-align:center;font-size:11px}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;white-space:nowrap}
  th{color:var(--mut);font-weight:400;font-size:10px;letter-spacing:.08em;text-align:right;padding:6px 12px;border-bottom:1px solid var(--line)}
  td{text-align:right;padding:6px 12px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  tbody tr:hover{background:var(--panel2)}

  .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .hd .range{flex-wrap:wrap}
  .cw{position:relative;padding:12px}
  #chart{width:100%;height:200px;display:block}
  #chart .grid line{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
  #chart .zero{stroke:var(--mut);stroke-dasharray:4 4;stroke-width:1;vector-effect:non-scaling-stroke}
  .tip{position:absolute;top:12px;display:none;background:#000;border:1px solid var(--line);padding:4px 8px;pointer-events:none;white-space:nowrap}
  .grid5.g6{grid-template-columns:repeat(6,1fr)}
  .bar{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;padding:5px 12px}
  .bar i{height:6px;background:var(--line);position:relative}
  .bar i::after{content:'';position:absolute;inset:0;width:var(--w);background:var(--acc)}
  .bar b{text-align:right;font-weight:500}
  .more{display:block;margin:10px auto}
  .side-note{padding:8px 12px;color:var(--mut);font-size:10px}
  .fr{display:flex;gap:14px;flex-wrap:wrap;padding:6px 12px;border-bottom:1px solid var(--line)}
  .fr.al{justify-content:space-between;align-items:flex-start;cursor:pointer;padding:9px 12px}
  .fr.unread{border-left:2px solid var(--acc)}
  .in{animation:in .35s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(-6px)}}
  @media(max-width:900px){.grid5.g6{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:900px){
    body{overflow:auto;height:auto}
    .top{flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px}
    .tabs{order:3;flex-basis:100%}
    .layout{grid-template-columns:1fr}
    .side{max-height:320px;border-right:0;border-bottom:1px solid var(--line)}
    .grid5{grid-template-columns:repeat(2,1fr)}
    .status{flex-wrap:wrap;gap:8px}
  }
  @media(prefers-reduced-motion:reduce){.dot.ok,.in{animation:none}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">TEMNILAN <span>// DEGEN TERMINAL</span></div>
  <nav class="tabs" id="tabs">
    <button class="on" data-v="overview">OVERVIEW</button>
    <button disabled title="Belum dibuat">WALLETS</button>
    <button data-v="activity">ACTIVITY</button>
    <button data-v="alerts">ALERTS</button>
  </nav>
  <div class="status" id="status"></div>
</header>

<section class="stats" id="stats"></section>

<div class="layout">
  <aside class="side">
    <div class="side-head">
      <h2>TRACKED WALLETS</h2>
      <input id="q" type="search" placeholder="Search tracked wallet..." autocomplete="off" />
      <div class="chips" id="chips"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Supabase → Project Settings → API. Pakai Project URL + anon/publishable key.
// Key ini memang publik (dilindungi RLS). JANGAN pernah taruh service role key di sini.
const SB_URL = 'https://hmjjujirktpqviayfehe.supabase.co';
const SB_KEY = 'sb_publishable_9HvmtHe0zC_SeMZ9iTix0A_VwiLs2wO';

const API = '/api/temnilan-wallets';
const FILTERS = [
  ['ALL', () => true],
  ['ACTIVE', w => w.status === 'active'],
  ['SMART MONEY', w => w.category === 'smart_money'],
  ['WHALE', w => w.category === 'whale'],
  ['SNIPER', w => w.category === 'sniper'],
  ['DEGEN', w => w.category === 'degen'],
];
const RANGES = ['7D', '30D', '90D', 'ALL'];
const S = { wallets: [], stats: null, filter: 'ALL', q: '', sel: null, range: 'ALL', detail: null, closed: [], mode: 'pnl', hf: 'ALL', hshown: 25, pts: [], view: 'overview', feed: [], gfeed: [], alerts: [], rt: null, ok: null, err: '', lastOk: null };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const short = a => a && a.length > 9 ? a.slice(0, 4) + '...' + a.slice(-4) : (a || '');
const catLabel = c => String(c || '').replace(/_/g, ' ').toUpperCase();
const num = v => (v === null || v === undefined || v === '' ? null : Number(v));

// Angka kosong SELALU tampil "—" / INSUFFICIENT DATA, tidak pernah diganti angka karangan.
function usd(v, signed) {
  const n = num(v); if (n === null || isNaN(n)) return '—';
  const s = Math.abs(n).toLocaleString('en-US', { maximumFractionDigits: n > -1000 && n < 1000 ? 2 : 0 });
  return (n < 0 ? '-' : signed && n > 0 ? '+' : '') + '$' + s;
}
function pct(v, signed) {
  const n = num(v); if (n === null || isNaN(n)) return '—';
  return (n < 0 ? '' : signed ? '+' : '') + n.toFixed(1) + '%';
}
function px(v) {
  const n = num(v); if (n === null || isNaN(n)) return '—';
  return n >= 1 ? '$' + n.toLocaleString('en-US', { maximumFractionDigits: 2 }) : '$' + n.toPrecision(3);
}
function dur(ms) {
  if (ms === null || ms === undefined || isNaN(ms)) return '—';
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m % 60}m` : `${m}m`;
}
function ago(iso) {
  if (!iso) return 'no activity';
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  return s < 60 ? Math.floor(s) + 's ago' : s < 3600 ? Math.floor(s / 60) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : Math.floor(s / 86400) + 'd ago';
}
const cls = v => (num(v) > 0 ? 'up' : num(v) < 0 ? 'down' : '');
const nd = html => html ?? '<span class="na">INSUFFICIENT DATA</span>';

/* ───────── data ───────── */
async function loadList() {
  try {
    const r = await fetch(API);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    S.wallets = d.wallets || []; S.stats = d.stats || null;
    S.ok = true; S.lastOk = new Date();
  } catch (e) { S.ok = false; S.err = e.message; }
  renderStatus(); renderStats(); renderList();
}

async function loadDetail(silent) {
  const id = S.sel; if (!id) return;
  if (!silent) { S.detail = null; renderMain(); }
  try {
    const [r, rc] = await Promise.all([
      fetch(`${API}?id=${encodeURIComponent(id)}&range=${S.range}`),
      fetch(`/api/temnilan-positions?wallet_id=${encodeURIComponent(id)}&status=closed`),
    ]);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const closed = rc.ok ? await rc.json() : null; // null = gagal dimuat, bukan "tidak ada data"
    if (S.sel !== id) return; // user sudah pindah wallet
    S.detail = d; S.closed = closed;
  } catch (e) { if (S.sel !== id) return; S.detail = { error: e.message }; }
  renderMain();
}

/* ───────── render ───────── */
function renderStatus() {
  $('status').innerHTML =
    `<span><span class="dot ${S.ok ? 'ok' : S.ok === false ? 'bad' : ''}"></span>${S.ok ? (S.rt === 'live' ? 'SOLANA · LIVE' : 'SOLANA · API OK') : S.ok === false ? 'API OFFLINE' : 'CONNECTING'}</span>` +
    `<span>REALTIME ${{ live: 'ON', connecting: 'CONNECTING', off: 'OFF' }[S.rt] || 'NOT SET'}</span>` +
    `<span><span class="dot"></span>RH CHAIN · NOT CONNECTED</span>` +
    `<span>LAST UPDATE ${S.lastOk ? S.lastOk.toLocaleTimeString('en-GB') : '--:--:--'}</span>`;
}

function renderStats() {
  const st = S.stats, v = k => (st ? st[k] : null);
  const cell = (l, val) => `<div class="stat"><div class="l">${l}</div><div class="v">${val ?? '<span class="na">DATA NOT CONNECTED</span>'}</div></div>`;
  $('stats').innerHTML =
    cell('TRACKED WALLETS', v('tracked_wallets')) +
    cell('ACTIVE NOW', v('active_now')) +
    cell('VOLUME 24H', st ? usd(v('volume_24h')) : null) +
    cell('TRANSACTIONS 24H', st ? Number(v('transactions_24h')).toLocaleString('en-US') : null) +
    cell('SOLANA PRICE', null); // belum ada sumber harga; diisi di tahap berikutnya
}

function renderChips() {
  $('chips').innerHTML = FILTERS.map(([n]) => `<button class="${n === S.filter ? 'on' : ''}" data-f="${n}">${n}</button>`).join('');
}

function renderList() {
  const fn = FILTERS.find(f => f[0] === S.filter)[1], q = S.q.toLowerCase();
  const rows = S.wallets.filter(fn).filter(w => !q || (w.name + ' ' + w.address).toLowerCase().includes(q));
  const el = $('list');
  if (S.ok === false && !S.wallets.length) { el.innerHTML = `<div class="empty">DATA NOT CONNECTED<br><span class="na">${esc(S.err)}</span></div>`; return; }
  if (S.ok === null) { el.innerHTML = '<div class="empty">WAITING FOR LIVE DATA</div>'; return; }
  if (!rows.length) { el.innerHTML = `<div class="empty">${S.wallets.length ? 'NO MATCH' : 'NO TRACKED WALLETS'}</div>`; return; }
  el.innerHTML = rows.map(w => {
    const pnl = num(w.total_pnl); // 0 = belum ada posisi tercatat, jadi ditampilkan "—"
    return `<button class="w ${String(w.id) === String(S.sel) ? 'on' : ''}" data-id="${esc(w.id)}">
      <span class="n">${esc(w.name)}</span>
      <span class="r ${w.status === 'active' ? 'up' : 'mut'}">${w.status === 'active' ? '● ACTIVE' : '○ IDLE'}</span>
      <span class="sub">${esc(short(w.address))} · ${esc(catLabel(w.category))}</span>
      <span class="r sub ${pnl ? cls(pnl) : ''}">${pnl ? usd(pnl, true) : '—'}</span>
      <span class="sub">${esc(ago(w.last_activity))}</span>
    </button>`;
  }).join('');
}

function renderMain() {
  const el = $('main'), w = S.wallets.find(x => String(x.id) === String(S.sel));
  if (S.view !== 'overview') {
    el.innerHTML = `<div class="panel"><h3>${S.view === 'alerts' ? 'ALERTS' : 'LIVE ACTIVITY — ALL WALLETS'}</h3><div id="feed"></div></div>`;
    renderFeed(); return;
  }
  if (!w) { el.innerHTML = '<div class="empty">Pilih wallet di sidebar untuk melihat detailnya.</div>'; return; }
  const d = S.detail;
  const head = `<div class="wh"><div>
      <h1>${esc(w.name)}</h1>
      <div class="mut">${esc(short(w.address))} · ${esc((w.chain || '').toUpperCase())} · <span class="${w.status === 'active' ? 'up' : ''}">${w.status === 'active' ? '● ACTIVE' : '○ IDLE'}</span></div>
    </div>
    <div class="range">${RANGES.map(r => `<button class="${r === S.range ? 'on' : ''}" data-r="${r}">${r}</button>`).join('')}</div></div>`;

  if (!d) { el.innerHTML = head + '<div class="empty">WAITING FOR LIVE DATA</div>'; return; }
  if (d.error) { el.innerHTML = head + `<div class="empty">DATA NOT CONNECTED<br><span class="na">${esc(d.error)}</span></div>`; return; }

  const st = d.stats || {};
  const box = (l, v) => `<div class="stat"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  const stats = '<div class="grid5">' +
    box('TOTAL PNL', st.total_pnl == null ? nd() : `<span class="${cls(st.total_pnl)}">${usd(st.total_pnl, true)}</span>`) +
    box('ROI', st.roi_pct == null ? nd() : `<span class="${cls(st.roi_pct)}">${pct(st.roi_pct, true)}</span>`) +
    box('WIN RATE', st.win_rate == null ? nd() : pct(st.win_rate)) +
    box('TOTAL TRADES', Number(st.total_trades || 0).toLocaleString('en-US')) +
    box('AVG HOLD', st.avg_hold_ms == null ? nd() : dur(st.avg_hold_ms)) + '</div>';

  const pos = d.positions || [];
  const posTable = pos.length ? `<div class="scroll"><table><thead><tr>
      <th>TOKEN</th><th>ENTRY</th><th>CURRENT</th><th>SIZE</th><th>PNL</th><th>ROI</th><th>HOLD TIME</th></tr></thead><tbody>` +
    pos.map(p => `<tr><td>$${esc(p.token_symbol || short(p.token_address))}</td><td>${px(p.entry_price)}</td><td>${px(p.current_price)}</td>
      <td>${num(p.size_sol) === null ? '—' : Number(p.size_sol).toFixed(2) + ' SOL'}</td>
      <td class="${cls(p.pnl_usd)}">${usd(p.pnl_usd, true)}</td><td class="${cls(p.roi_pct)}">${pct(p.roi_pct, true)}</td>
      <td>${dur(Date.now() - new Date(p.opened_at))}</td></tr>`).join('') + '</tbody></table></div>'
    : '<div class="ph">Tidak ada posisi terbuka.</div>';

  const modes = [['pnl', 'PNL'], ['roi', 'ROI'], ['value', 'PORTFOLIO VALUE']]
    .map(([k, l]) => `<button class="${S.mode === k ? 'on' : ''}" data-m="${k}">${l}</button>`).join('');
  el.innerHTML = head + stats +
    `<div class="panel"><h3 class="hd">PERFORMANCE <span class="range">${modes}</span></h3>${chartHTML()}<div class="side-note">Realized PnL dari posisi yang sudah ditutup. Belum termasuk PnL yang belum terealisasi.</div></div>` +
    `<div class="panel"><h3>LIVE WALLET ACTIVITY</h3><div id="feed"></div></div>` +
    `<div class="panel"><h3>OPEN POSITIONS</h3>${posTable}</div>` +
    historyHTML(d) +
    `<div class="panel"><h3>WALLET BEHAVIOR</h3>${behaviorHTML(d)}</div>`;
  renderFeed();
}

/* ───────── chart, history, behavior ───────── */
const sinceMs = () => { const n = { '7D': 7, '30D': 30, '90D': 90 }[S.range]; return n ? Date.now() - n * 864e5 : 0; };
const inRange = p => p.closed_at && new Date(p.closed_at) >= sinceMs();

function chartHTML() {
  if (S.mode === 'value') return '<div class="ph">DATA NOT CONNECTED — nilai portofolio butuh data saldo dan harga token</div>';
  if (S.closed === null) return '<div class="ph">DATA NOT CONNECTED</div>';
  const rows = S.closed.filter(p => inRange(p) && num(p.pnl_usd) !== null).sort((a, b) => new Date(a.closed_at) - new Date(b.closed_at));
  let cum = 0, inv = 0;
  S.pts = rows.map(p => { cum += Number(p.pnl_usd); inv += num(p.bought_usd) || 0; return { t: p.closed_at, v: S.mode === 'roi' ? (inv ? cum / inv * 100 : 0) : cum }; });
  if (!S.pts.length) return '<div class="ph">WAITING FOR LIVE DATA — belum ada posisi yang ditutup pada periode ini</div>';
  const W = 800, H = 200, P = 10, vs = S.pts.map(p => p.v), n = vs.length;
  const lo = Math.min(0, ...vs), hi = Math.max(0, ...vs), span = (hi - lo) || 1;
  const X = i => P + i / (n - 1) * (W - 2 * P), Y = v => H - P - (v - lo) / span * (H - 2 * P);
  const line = n > 1 ? vs.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ') : `${P},${Y(vs[0])} ${W - P},${Y(vs[0])}`;
  const grid = [0, .25, .5, .75, 1].map(f => { const y = P + f * (H - 2 * P); return `<line x1="0" x2="${W}" y1="${y}" y2="${y}"/>`; }).join('');
  return `<div class="cw"><svg id="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><g class="grid">${grid}</g>
    <line class="zero" x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}"/>
    <polyline points="${line}" fill="none" stroke="${vs[n - 1] >= 0 ? 'var(--up)' : 'var(--down)'}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg><div id="tip" class="tip"></div></div>`;
}

function historyHTML(d) {
  const all = d.transactions || [], f = S.hf;
  const rows = all.filter(t => f === 'ALL' || (f === 'BUY' && t.side === 'buy') || (f === 'SELL' && t.side === 'sell') ||
    (f === 'PROFIT' && num(t.pnl_usd) > 0) || (f === 'LOSS' && num(t.pnl_usd) < 0));
  const bar = ['ALL', 'BUY', 'SELL', 'PROFIT', 'LOSS'].map(x => `<button class="${x === f ? 'on' : ''}" data-hf="${x}">${x}</button>`).join('');
  let body;
  if (!all.length) body = '<div class="ph">WAITING FOR LIVE DATA — belum ada transaksi pada periode ini</div>';
  else if (!rows.length) body = '<div class="ph">NO MATCH</div>';
  else {
    const fmt = iso => new Date(iso).toLocaleString('en-GB', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
    body = `<div class="scroll"><table><thead><tr><th>TIME</th><th>TOKEN</th><th>SIDE</th><th>AMOUNT</th><th>PRICE</th><th>VALUE</th><th>PNL</th></tr></thead><tbody>` +
      rows.slice(0, S.hshown).map(t => `<tr><td>${fmt(t.occurred_at)}</td><td>$${esc(t.token_symbol || short(t.token_address))}</td>
        <td class="${t.side === 'buy' ? 'up' : 'down'}">${t.side === 'buy' ? 'BUY' : 'SELL'}</td>
        <td>${num(t.amount_sol) === null ? '—' : Number(t.amount_sol).toFixed(2) + ' SOL'}</td><td>${px(t.price)}</td><td>${usd(t.amount_usd)}</td>
        <td class="${cls(t.pnl_usd)}">${usd(t.pnl_usd, true)}</td></tr>`).join('') + '</tbody></table></div>' +
      `<div class="side-note">Menampilkan ${Math.min(S.hshown, rows.length)} dari ${rows.length} transaksi (maks 500 terbaru pada periode ini).</div>` +
      (rows.length > S.hshown ? '<button class="more" data-more>SHOW MORE</button>' : '');
  }
  return `<div class="panel"><h3 class="hd">TRADE HISTORY <span class="range">${bar}</span></h3>${body}</div>`;
}

function behaviorHTML(d) {
  const b = d.behavior, st = d.stats || {};
  if (!b || b.insufficient_data) return '<div class="ph"><span class="na">INSUFFICIENT DATA</span> — butuh minimal 5 transaksi pada periode ini</div>';
  const cl = (S.closed || []).filter(p => inRange(p) && num(p.pnl_usd) !== null);
  const wins = cl.filter(p => p.pnl_usd > 0), losses = cl.filter(p => p.pnl_usd < 0);
  const avg = a => a.reduce((s, p) => s + Number(p.pnl_usd), 0) / a.length;
  const pos = cl.length ? cl.reduce((s, p) => s + (num(p.bought_usd) || 0), 0) / cl.length : null;
  const m = (l, v) => `<div class="stat"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  const hasHold = b.avg_hold_minutes != null;
  const bar = (l, v) => `<div class="bar"><span>${l}</span><i style="--w:${Math.round(v * 100)}%"></i><b>${Math.round(v * 100)}%</b></div>`;
  const off = l => `<div class="bar"><span>${l}</span><span class="na">NEEDS TOKEN DATA</span></div>`;
  return '<div class="grid5 g6">' +
    m('AVG HOLD TIME', hasHold ? dur(b.avg_hold_minutes * 60000) : nd()) +
    m('WIN RATE', st.win_rate == null ? nd() : pct(st.win_rate)) +
    m('AVG WIN', wins.length ? `<span class="up">${usd(avg(wins), true)}</span>` : nd()) +
    m('AVG LOSS', losses.length ? `<span class="down">${usd(avg(losses), true)}</span>` : nd()) +
    m('TRADES / DAY', Number(b.trades_per_day).toFixed(1)) +
    m('AVG POSITION', pos == null ? nd() : usd(pos)) + '</div>' +
    '<div style="padding:8px 0">' +
    (hasHold ? bar('SCALPING', b.scalping_score) : `<div class="bar"><span>SCALPING</span><span class="na">INSUFFICIENT DATA</span></div>`) +
    off('EARLY ENTRY') + off('QUICK EXIT') +
    (hasHold ? bar('LONG HOLD', b.long_hold_score) : `<div class="bar"><span>LONG HOLD</span><span class="na">INSUFFICIENT DATA</span></div>`) + '</div>';
}

/* ───────── feed + realtime ───────── */
const wn = x => (x.temnilan_wallets && x.temnilan_wallets.name) || (S.wallets.find(w => String(w.id) === String(x.wallet_id)) || {}).name || (x.wallet_id ? 'WALLET #' + x.wallet_id : '');
const getJSON = async u => { const r = await fetch(u); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); };

function txRow(t, showW) {
  const buy = t.side === 'buy', c = t._new ? ' in' : ''; delete t._new;
  return `<div class="fr${c}"><span class="${buy ? 'up' : 'down'}">● ${buy ? 'BUY' : 'SELL'}</span><span>$${esc(t.token_symbol || short(t.token_address))}</span>
    <span>${num(t.amount_sol) === null ? '—' : Number(t.amount_sol).toFixed(2) + ' SOL'}</span><span>${usd(t.amount_usd)}</span>
    <span class="mut">${new Date(t.occurred_at).toLocaleTimeString('en-GB')}</span>${showW ? `<span class="mut">${esc(wn(t))}</span>` : ''}<span class="mut">${esc(t.dex || '')}</span></div>`;
}

function alertRow(a) {
  const c = (a._new ? ' in' : '') + (a.is_read ? '' : ' unread'); delete a._new;
  const sym = '$' + esc(a.token_symbol || '?'), m = a.meta || {};
  const kind = { large_buy: 'LARGE BUY', large_sell: 'LARGE SELL', multi_wallet: 'MULTI-WALLET ACTIVITY' }[a.type] || esc(a.type);
  const line = a.type === 'multi_wallet'
    ? `${Number(m.wallet_count || 0)} tracked wallets bought ${sym} within ${Number(m.window_seconds || 0)} seconds`
    : `${esc(wn(a))} ${a.type === 'large_buy' ? 'bought' : 'sold'} ${sym}`;
  const amt = a.type === 'multi_wallet' ? '' : `<div>${num(a.amount_sol) === null ? '—' : Number(a.amount_sol).toFixed(1) + ' SOL'} · ${usd(a.amount_usd)}</div>`;
  return `<div class="fr al${c}" data-aid="${esc(a.id)}"><div><b class="${a.type === 'large_sell' ? 'down' : 'up'}">${kind}</b><div>${line}</div>${amt}</div><span class="mut">${ago(a.created_at)}</span></div>`;
}

function renderFeed() {
  const el = $('feed'); if (!el) return;
  const src = S.view === 'alerts' ? S.alerts : S.view === 'activity' ? S.gfeed : S.feed;
  if (src === null) { el.innerHTML = '<div class="ph">DATA NOT CONNECTED</div>'; return; }
  el.innerHTML = src.length
    ? src.map(x => S.view === 'alerts' ? alertRow(x) : txRow(x, S.view === 'activity')).join('')
    : '<div class="ph">WAITING FOR LIVE DATA</div>';
}

async function loadFeed() { // feed wallet yang dipilih
  const id = S.sel; if (!id) return;
  try { const d = await getJSON(`/api/temnilan-activity?limit=30&wallet_id=${encodeURIComponent(id)}`); if (S.sel === id) S.feed = d; }
  catch (e) { if (S.sel === id) S.feed = null; }
  renderFeed();
}
async function loadView() { // tab ACTIVITY / ALERTS
  try {
    if (S.view === 'activity') S.gfeed = await getJSON('/api/temnilan-activity?limit=50');
    if (S.view === 'alerts') S.alerts = await getJSON('/api/temnilan-alerts?limit=50');
  } catch (e) { if (S.view === 'activity') S.gfeed = null; else S.alerts = null; }
  renderFeed();
}
async function markRead(id) {
  const a = (S.alerts || []).find(x => String(x.id) === String(id)); if (!a || a.is_read) return;
  a.is_read = true; renderFeed();
  try { const r = await fetch(`/api/temnilan-alerts?id=${encodeURIComponent(id)}`, { method: 'PATCH' }); if (!r.ok) throw 0; }
  catch (e) { a.is_read = false; renderFeed(); }
}
function renderTabs() { document.querySelectorAll('#tabs [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === S.view)); }

function onTx(t) {
  if (!t) return; t._new = true;
  if (Array.isArray(S.gfeed) && !S.gfeed.some(x => x.id === t.id)) S.gfeed = [t, ...S.gfeed].slice(0, 100);
  const mine = String(t.wallet_id) === String(S.sel);
  if (mine && Array.isArray(S.feed) && !S.feed.some(x => x.id === t.id)) S.feed = [t, ...S.feed].slice(0, 50);
  renderFeed();
  clearTimeout(S._rf); // stat global & status wallet di-refresh sekali setelah event berhenti
  S._rf = setTimeout(() => { loadList(); if (mine) loadDetail(true); }, 1500);
}
function onAlert(a) {
  if (!a) return; a._new = true;
  if (Array.isArray(S.alerts) && !S.alerts.some(x => x.id === a.id)) S.alerts = [a, ...S.alerts].slice(0, 100);
  renderFeed();
}

function startRealtime() {
  if (!SB_URL || !SB_KEY) return; // belum diisi -> header nulis REALTIME NOT SET
  if (!window.supabase) { S.rt = 'off'; renderStatus(); return; }
  S.rt = 'connecting'; renderStatus();
  const sb = window.supabase.createClient(SB_URL, SB_KEY);
  let wasOff = false;
  sb.channel('temnilan-live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'temnilan_transactions' }, p => onTx(p.new))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'temnilan_alerts' }, p => onAlert(p.new))
    .subscribe(st => {
      S.rt = st === 'SUBSCRIBED' ? 'live' : st === 'CONNECTING' ? 'connecting' : 'off';
      renderStatus();
      if (S.rt === 'off') wasOff = true;
      else if (S.rt === 'live' && wasOff) { wasOff = false; loadList(); loadFeed(); loadView(); } // kejar event yang kelewat
    });
}

/* ───────── events ───────── */
$('chips').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; S.filter = b.dataset.f; renderChips(); renderList(); });
$('q').addEventListener('input', e => { S.q = e.target.value; renderList(); });
$('list').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (!b) return; S.sel = b.dataset.id; S.view = 'overview'; S.feed = []; renderTabs(); renderList(); loadDetail(); loadFeed(); });
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; S.view = b.dataset.v; renderTabs(); renderMain(); if (S.view !== 'overview') loadView(); });
$('main').addEventListener('click', e => {
  const t = e.target.closest('[data-r],[data-m],[data-hf],[data-more],[data-aid]'); if (!t) return;
  if (t.dataset.aid) return markRead(t.dataset.aid);
  if (t.dataset.r) { S.range = t.dataset.r; S.hshown = 25; return loadDetail(); }
  if (t.dataset.m) S.mode = t.dataset.m;
  if (t.dataset.hf) { S.hf = t.dataset.hf; S.hshown = 25; }
  if ('more' in t.dataset) S.hshown += 25;
  renderMain();
});
$('main').addEventListener('mousemove', e => {
  const c = e.target.closest('#chart'), tip = $('tip'), n = S.pts.length;
  if (!c || !tip || !n) return;
  const b = c.getBoundingClientRect();
  const p = S.pts[n > 1 ? Math.max(0, Math.min(n - 1, Math.round((e.clientX - b.left) / b.width * (n - 1)))) : 0];
  tip.style.display = 'block'; tip.style.left = Math.max(0, Math.min(e.clientX - b.left, b.width - 170)) + 'px';
  tip.textContent = new Date(p.t).toLocaleString('en-GB', { hour12: false }) + '  ' + (S.mode === 'roi' ? pct(p.v, true) : usd(p.v, true));
});
$('main').addEventListener('mouseout', e => { const tip = $('tip'); if (tip && e.target.closest('#chart')) tip.style.display = 'none'; });

renderStatus(); renderStats(); renderChips(); renderList(); renderMain();
loadList();
startRealtime();
setInterval(() => { if (S.rt !== 'live') loadList(); }, 60000); // polling cuma jadi cadangan kalau realtime mati
setInterval(renderFeed, 15000); // update label "x sec ago"
</script>
</body>
</html>
