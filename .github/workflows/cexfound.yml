name: CEX Found poller

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: "Berapa menit ke belakang (30 = normal, 4320 = 3 hari)"
        default: "30"

concurrency:
  group: cexfound
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install telethon requests
      - run: python scripts/cexfound_poll.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS }}
          LOOKBACK_MIN: ${{ inputs.lookback_minutes || '30' }}
          CEXFOUND_API_URL: https://airdropxi.vercel.app/api/admin-airdrop?type=cex-found
