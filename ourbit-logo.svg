<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 110" width="486" height="110" role="img" aria-label="OURBIT">
  <title>OURBIT</title>
  <style>
    .g  { fill: #3DAE78; }
    .w  { fill: none; stroke: #FFFFFF; stroke-width: 18; }
    .wf { fill: #FFFFFF; }
  </style>

  <!-- Ikon: perisai heksagon berlubang + heksagon di tengah -->
  <g transform="translate(0 5)">
    <path class="g" fill-rule="evenodd" d="M0 12 L26 0 L50 14 L74 0 L100 12 V66 L50 100 L0 66 Z M50 26 L78 41 L78 67 L50 82 L22 67 L22 41 Z"/>
    <path class="g" d="M50 39 L63 46.5 L63 61.5 L50 69 L37 61.5 L37 46.5 Z"/>
  </g>

  <!-- Huruf OURBIT (digambar sebagai path, jadi aman dipakai lewat <img>) -->
  <g transform="translate(0 3)">
    <!-- O -->
    <rect class="w" x="139" y="21" width="40" height="62" rx="16"/>
    <!-- U -->
    <path class="w" d="M205 12 V66 A17 17 0 0 0 222 83 H228 A17 17 0 0 0 245 66 V12"/>
    <!-- R -->
    <path class="w" d="M271 12 V92"/>
    <path class="w" d="M271 21 H293.5 A17.5 17.5 0 0 1 293.5 56 H271"/>
    <path class="wf" d="M280 56 L302 56 L320 92 L298 92 Z"/>
    <!-- B -->
    <path class="w" d="M337 12 V92"/>
    <path class="w" d="M337 21 H361.5 A15.5 15.5 0 0 1 361.5 52 H337"/>
    <path class="w" d="M337 52 H361.5 A15.5 15.5 0 0 1 361.5 83 H337"/>
    <!-- I = lilin candlestick hijau -->
    <rect class="g" x="401.25" y="5" width="3.5" height="94"/>
    <rect class="g" x="394" y="16" width="18" height="72"/>
    <!-- T -->
    <path class="w" d="M420 21 H478"/>
    <path class="w" d="M449 12 V92"/>
  </g>
</svg>
