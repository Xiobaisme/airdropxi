<!DOCTYPE html>
<html lang="id" data-require="admin">
<head>
    <style>html{visibility:hidden}</style>
    <script src="/js/guard.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Agent · CMIC</title>
    <link rel="icon" type="image/svg+xml" href="/cmic-icon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/news.css">
    <link rel="stylesheet" href="/css/onchain.css">
    <link rel="stylesheet" href="/css/lab.css">
</head>
<body>

<!-- ─── AI AGENT PANEL ─── -->
        <div id="agent-modal" class="modal hidden">
            <div class="agent-app">
                <div class="agent-header">
                    <div class="agent-header-top">
                        <div class="agent-brand">
                            <span class="agent-brand-dot"></span>
                            <span class="agent-brand-title">AI Agent</span>
                            <span class="agent-brand-pill">BETA</span>
                        </div>
                        <div class="agent-header-actions">
                            <button class="agent-new-chat" id="agentNewChatBtn">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                                Chat baru
                            </button>
                            <button class="modal-close" onclick="toggleAgentPanel()" id="agent-modal-close-btn"></button>
                        </div>
                    </div>

                    <div class="agent-row" id="agentRow">
                        <span class="agent-row-label">Agent</span>
                        <!-- agent chips injected by JS -->
                    </div>

                    <div class="agent-mode-row">
                        <span class="agent-row-label">Mode</span>
                        <div class="agent-mode-track" id="agentModeTrack"><!-- injected --></div>
                    </div>
                </div>

                <div class="agent-messages" id="agentMessages"></div>

                <div class="agent-composer">
                    <div id="agentAttachPreviewSlot"></div>
                    <div class="agent-composer-row">
                        <button class="agent-icon-btn" id="agentAttachBtn" title="Lampirkan gambar" style="display:none;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                        </button>
                        <input type="file" id="agentFileInput" accept="image/*" style="display:none;">
                        <textarea id="agentComposerInput" rows="1" placeholder="Tulis pesan..."></textarea>
                        <button class="agent-send-btn" id="agentSendBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                        </button>
                    </div>
                    <div class="agent-hint" id="agentHintText">Enter untuk kirim · Shift+Enter untuk baris baru</div>
                </div>
            </div>
        </div>

        
<!-- ─── CONFIRM MODAL (custom, ganti native confirm()) ─── -->
<div id="confirm-modal" class="modal hidden">
    <div class="modal-box confirm-box">
        <div class="confirm-icon" id="confirm-icon"></div>
        <div class="confirm-title" id="confirm-title">Konfirmasi</div>
        <div class="confirm-msg" id="confirm-msg">Yakin ingin melanjutkan?</div>
        <div class="confirm-actions">
            <button class="btn-cancel" id="confirm-cancel-btn">Batal</button>
            <button class="btn-danger-confirm" id="confirm-ok-btn">Ya, Hapus</button>
        </div>
    </div>
</div>

        

    <div class="toast" id="toast"></div>

    <script src="/js/core.js"></script>
    <script src="/js/agent.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            toggleAgentPanel();
            ['toggleAgentPanel'].forEach(function (n) {
                window[n] = function () { location.href = '/'; };
            });
        });
    </script>
</body>
</html>
