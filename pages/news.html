<!DOCTYPE html>
<html lang="id">
<head>
    <style>html{visibility:hidden}</style>
    <script src="/js/guard.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News Terminal · CMIC</title>
    <link rel="icon" type="image/svg+xml" href="/cmic-icon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/news.css">
    <link rel="stylesheet" href="/css/onchain.css">
    <link rel="stylesheet" href="/css/lab.css">
</head>
<body>

<!-- ─── NEWS TERMINAL ─── -->
<div class="news-overlay" id="news-overlay"></div>
<div class="news-drawer" id="news-drawer">
  <div class="news-resizer" id="news-resizer" title="Geser untuk ubah lebar · klik 2x untuk reset"></div>
    <div class="news-head">
        <div class="news-head-top">
            <div class="hero-eyebrow" style="margin-bottom:0;">News Terminal</div>
          <button class="modal-close" onclick="toggleNewsPanel()" id="news-close-btn"></button>
        </div>
               <div class="news-title">Market &amp; Onchain Feed</div>
        <div class="news-sub"><span class="news-clock" id="news-clock">--:--:--</span> WIB · <span id="news-count">0</span> berita</div>
        <div class="news-src-bar" id="news-src-bar"></div>   <!-- BARU: ikon sumber -->
    </div>
   <div class="news-filters" id="news-filters"></div>

<!-- NEW = New Listings + CEX Found + channel Telegram -->
<div class="new-strip" id="new-strip">
    <div class="nlf-head">
        <span class="nlf-dot" id="nlf-dot"></span>
        <span class="nlf-title">NEW</span>
        <span class="nlf-status" id="nlf-status">Menghubungkan...</span>
        <a class="nlf-btn" href="https://newlistings.pro" target="_blank" rel="noopener" style="text-decoration:none;">Riwayat lengkap ↗</a>
        <button class="nlf-btn" id="nlf-toggle" onclick="toggleNLFAll()">Semua event</button>
    </div>
    <div class="nlf-list" id="new-list"><div class="nlf-empty">Menunggu listing baru...</div></div>
</div>

<div class="news-feed" id="news-feed"></div>
    <div class="news-foot">
      <span>Live · cek antrian tiap <span id="news-countdown">00:30</span></span>
        <button class="news-refresh-btn" onclick="loadNews(true)">↻ REFRESH</button>
    </div>
</div>

        
<!-- ─── NEWS SEND MODAL (kirim 1 item News Terminal ke Discord & Telegram) ─── -->
<div id="news-send-modal" class="modal hidden">
    <div class="modal-box">
        <div class="modal-head">
            <div class="modal-title">Send sekarang?</div>
            <button class="modal-close" onclick="closeNewsSend()" id="news-send-close-btn"></button>
        </div>
        <div class="modal-body">
            <div class="field">
                <label>Caption <span class="hint">— bisa diedit sebelum dikirim</span></label>
                <textarea id="ns-caption" style="min-height:180px;"></textarea>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeNewsSend()">Batal</button>
            <button class="btn-save" id="btn-news-send" onclick="sendNewsItem()">Kirim</button>
        </div>
    </div>
</div>

      
<!-- ─── CONFIRM MODAL (custom, ganti native confirm()) ─── -->
<div id="confirm-modal" class="modal hidden">
    <div class="modal-box confirm-box">
        <div class="confirm-icon" id="confirm-icon"></div>
        <div class="confirm-title" id="confirm-title">Konfirmasi</div>
        <div class="confirm-msg" id="confirm-msg">Yakin ingin melanjutkan?</div>
        <div class="confirm-actions">
            <button class="btn-cancel" id="confirm-cancel-btn">Batal</button>
            <button class="btn-danger-confirm" id="confirm-ok-btn">Ya, Hapus</button>
        </div>
    </div>
</div>

        
<!-- ─── PIN MODAL (wajib tiap kirim) ─── -->
<div id="pin-modal" class="modal hidden" style="z-index:1800">
    <div class="modal-box confirm-box">
        <div class="confirm-title">Masukkan PIN</div>
        <div class="confirm-msg">Verifikasi dulu sebelum kirim ke Discord &amp; Telegram.</div>
        <div class="field">
            <input id="pin-input" type="password" inputmode="numeric" autocomplete="off"
                   placeholder="••••••" style="text-align:center;letter-spacing:.4em;" />
        </div>
        <div class="confirm-actions" style="margin-top:1.2rem;">
            <button class="btn-cancel" id="pin-cancel-btn">Batal</button>
            <button class="btn-save" id="pin-ok-btn">Verifikasi</button>
        </div>
    </div>
</div>



    <div class="toast" id="toast"></div>

    <script src="/js/core.js"></script>
    <script src="/js/news.js"></script>
    <script src="/js/broadcast.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            toggleNewsPanel();
            ['toggleNewsPanel'].forEach(function (n) {
                window[n] = function () { location.href = '/'; };
            });
        });
    </script>
</body>
</html>
